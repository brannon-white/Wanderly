name: Trail Ingestion Worker

on:
  schedule:
    # Runs every 30 minutes — well within GitHub Actions free tier (2000 min/month)
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      max_batch:
        description: "Max destinations to process per run"
        required: false
        default: "10"

jobs:
  process-queue:
    name: Process trail ingestion queue
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install firebase-admin
        working-directory: functions
        run: npm ci --omit=dev

      - name: Process trail ingestion queue
        env:
          # Store your service account JSON (base64-encoded) as a GitHub repo secret:
          #   cat scripts/serviceAccount.json | base64 | pbcopy
          #   GitHub → Settings → Secrets → Actions → New repository secret
          #   Name: FIREBASE_SERVICE_ACCOUNT_JSON
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MAX_BATCH: ${{ github.event.inputs.max_batch || '10' }}
        run: node scripts/processTrailQueue.js
